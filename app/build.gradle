plugins {
    id 'com.android.application'
}

def appVersion = {
    def ref = System.getenv("GITHUB_REF_NAME") ?: ""
    def m = ref =~ /^v(\d+)\.(\d+)\.(\d+)$/
    if (m.matches()) {
        def major = m.group(1).toInteger()
        def minor = m.group(2).toInteger()
        def patch = m.group(3).toInteger()
        return [
            code: major * 10000 + minor * 100 + patch,
            name: "${major}.${minor}.${patch}".toString()
        ]
    }
    return [code: 1, name: "0.0.1"]
}()

android {
    namespace 'rel.nothing'
    compileSdk 35

    defaultConfig {
        applicationId "rel.nothing"
        minSdk 21
        targetSdk 35
        versionCode appVersion.code
        versionName appVersion.name
    }

    signingConfigs {
        release {
            // Populated only when CI / a local build provides the env vars below.
            // When unset, the release buildType falls back to debug signing so
            // the project still builds locally without a keystore.
            def keystorePath = System.getenv("RELEASE_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile file(keystorePath)
                storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv("RELEASE_KEYSTORE_PATH") ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
